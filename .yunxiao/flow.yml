name: dockerfiles-镜像构建推送

# ── 流水线变量 ────────────────────────────────────────────────────────────────
# REGISTRY / REGISTRY_HOST / REGISTRY_USERNAME 可在流水线"变量和缓存"UI 页面覆盖。
# REGISTRY_PASSWORD 等敏感变量建议通过 UI"私密变量"或"通用变量组"管理，不写入 YAML。
variables:
  - key: REGISTRY
    value: registry.cn-hangzhou.aliyuncs.com/onemanstudio
    # 可选值：
    #   registry.cn-hangzhou.aliyuncs.com/onemanstudio   （阿里云，默认）
    #   harbor.mcdchina.net/devops-public                （内部 Harbor）
  - key: REGISTRY_HOST
    value: registry.cn-hangzhou.aliyuncs.com
    # Harbor 时改为：harbor.mcdchina.net
  - key: TAG
    value: latest
    # 建议 CI 运行时传入 Git short SHA，例如：git rev-parse --short HEAD

# ── 代码源 ────────────────────────────────────────────────────────────────────
sources:
  main_repo:
    type: codeup                            # 按实际平台修改：codeup / github / gitlab
    name: dockerfiles
    endpoint: <your-codeup-repository-url>  # 替换为代码仓库 URL
    branch: main
    triggerEvents: push                     # push 到 main 分支时自动触发
    certificate:
      type: serviceConnection
      serviceConnection: <your-service-connection-id>  # 在云效"服务连接"中创建并填入

# ── 流水线阶段 ────────────────────────────────────────────────────────────────
stages:

  # ── 阶段 1：初始化构建环境 ───────────────────────────────────────────────────
  prepare_stage:
    name: 初始化构建环境
    jobs:
      prepare_job:
        name: 初始化 docker buildx
        runsOn: public/cn-hangzhou          # 公共集群（杭州），与阿里云 ACR 同地域减少推送延迟
        steps:
          check_env:
            step: CommandScript
            name: 检查环境
            with:
              run: |
                echo "=== Docker 版本 ==="
                docker version --format '{{.Server.Version}}'
                echo "=== Buildx 版本 ==="
                docker buildx version

          setup_buildx:
            step: CommandScript
            name: 创建多架构 Builder
            with:
              run: |
                # 若 builder 已存在则直接切换，避免重复创建报错
                docker buildx create \
                  --name multiarch \
                  --driver docker-container \
                  --use \
                  --bootstrap 2>/dev/null \
                  || docker buildx use multiarch
                docker buildx inspect --bootstrap
                echo "=== 支持的构建平台 ==="
                docker buildx ls

  # ── 阶段 2：登录镜像仓库 ─────────────────────────────────────────────────────
  login_stage:
    name: 登录镜像仓库
    jobs:
      login_job:
        name: docker login
        runsOn: public/cn-hangzhou
        steps:
          docker_login:
            step: CommandScript
            name: 登录 ${REGISTRY_HOST}
            with:
              run: |
                # REGISTRY_USERNAME / REGISTRY_PASSWORD 请在 UI"私密变量"中配置
                echo "${REGISTRY_PASSWORD}" \
                  | docker login "${REGISTRY_HOST}" \
                      -u "${REGISTRY_USERNAME}" \
                      --password-stdin
                echo "登录成功：${REGISTRY_HOST}"

  # ── 阶段 3：构建并推送全部镜像 ──────────────────────────────────────────────
  build_stage:
    name: 构建并推送镜像
    jobs:
      bake_job:
        name: docker buildx bake 全量构建
        runsOn: public/cn-hangzhou
        steps:
          resolve_tag:
            step: CommandScript
            name: 确定镜像 Tag
            with:
              run: |
                # 优先使用流水线变量 TAG，若为 latest 则追加 Git short SHA 作为固定版本标记
                GIT_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
                echo "Git short SHA：${GIT_SHORT}"
                if [ "${TAG}" = "latest" ]; then
                  export BUILD_TAG="${GIT_SHORT}"
                else
                  export BUILD_TAG="${TAG}"
                fi
                echo "本次构建 TAG：${BUILD_TAG}"
                # 将计算结果写入环境，供后续步骤读取
                echo "BUILD_TAG=${BUILD_TAG}" >> $PIPELINE_ENV

          bake_all:
            step: CommandScript
            name: 构建并推送所有镜像
            with:
              run: |
                echo "目标仓库：${REGISTRY}"
                echo "镜像 Tag ：${BUILD_TAG:-${TAG}}"

                # docker-bake.hcl 中的 REGISTRY / TAG 变量由此处环境变量注入
                REGISTRY="${REGISTRY}" \
                TAG="${BUILD_TAG:-${TAG}}" \
                docker buildx bake --push

                echo "=== 构建完成，已推送至 ${REGISTRY} ==="

          print_summary:
            step: CommandScript
            name: 打印推送摘要
            with:
              run: |
                echo "───────────────────────────────────"
                echo "  仓库  : ${REGISTRY}"
                echo "  Tag   : ${BUILD_TAG:-${TAG}}"
                echo "  镜像  : ubuntu / nginx / node"
                echo "───────────────────────────────────"
