name: 镜像构建并推送

on:
  push:
    branches: [main]
  # 支持手动触发，可在 Actions 页面指定 REGISTRY 和 TAG
  workflow_dispatch:
    inputs:
      registry:
        description: "目标镜像仓库（留空使用默认阿里云）"
        required: false
        default: ""
      tag:
        description: "镜像 Tag（留空使用 git short SHA）"
        required: false
        default: ""

# 同一分支同时有多次 push 时，取消旧的构建，只保留最新一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 默认推送至阿里云；手动触发时可通过 inputs.registry 覆盖
  # Harbor 切换：在 GitHub 仓库 Settings → Secrets 中修改 REGISTRY / REGISTRY_HOST
  REGISTRY: ${{ inputs.registry || vars.REGISTRY || 'registry.cn-hangzhou.aliyuncs.com/onemanstudio' }}
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'registry.cn-hangzhou.aliyuncs.com' }}

jobs:
  build-and-push:
    name: Buildx Bake 全量构建
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 2. 确定镜像 Tag ───────────────────────────────────────────────────────
      - name: 确定镜像 Tag
        id: tag
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            BUILD_TAG="$INPUT_TAG"
          else
            BUILD_TAG="${GITHUB_SHA::8}"
          fi
          echo "BUILD_TAG=${BUILD_TAG}" >> $GITHUB_ENV
          echo "build_tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "本次构建 TAG：${BUILD_TAG}"

      # ── 3. 设置 QEMU（多平台模拟，支持 arm64 等非原生平台） ──────────────────
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # ── 4. 设置 docker buildx（docker-container driver，支持多平台） ─────────
      - name: 设置 docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # ── 5. 登录镜像仓库 ───────────────────────────────────────────────────────
      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── 6. 构建并推送全部镜像 ─────────────────────────────────────────────────
      - name: 构建并推送所有镜像
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ env.BUILD_TAG }}
          # 多平台构建；如只需 amd64 可改为 linux/amd64
          BUILD_PLATFORMS: linux/amd64,linux/arm64
        run: |
          echo "目标仓库：${REGISTRY}"
          echo "镜像 Tag ：${TAG}"
          docker buildx bake --push

      # ── 7. 构建摘要 ───────────────────────────────────────────────────────────
      - name: 构建摘要
        run: |
          echo "### 镜像推送完成 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 字段 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 仓库 | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag  | \`${{ env.BUILD_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ubuntu / nginx / node |" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
